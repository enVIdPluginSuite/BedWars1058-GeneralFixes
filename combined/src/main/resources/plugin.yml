name: BedWars1058-GeneralFixes
version: '${version}'
main: dev.etran.generalfixes.GeneralFixesPlugin
# api-version 1.13 is ignored by 1.8 - 1.12 and is the lowest value newer servers accept without legacy conversion.
api-version: '1.13'
author: LittleBotEngineer
description: Small gameplay fixes for BedWars1058.
depend: [BedWars1058]

commands:
  bwfixes:
    description: Manage BedWars1058-GeneralFixes
    usage: /<command> [reload]
    aliases: [bwgf, bw1058fixes]

permissions:
  bwfixes.admin:
    description: Allows /bwfixes reload
    default: op
