# BedWars1058-GeneralFixes
# Edit this file, then run /bwfixes reload in-game or from the console. No restart needed.
# Any option you delete falls back to the default that ships inside the jar.

messages:
  prefix: "&8[&bBW-GeneralFixes&8] &7"
  reload-success: "&aConfiguration reloaded."
  reload-failed: "&cReload failed, check the console. The previous settings are still active."
  no-permission: "&cYou do not have permission to do that."
  usage: "&7Usage: &f/%label% reload"

fixes:

  # 1) BedWars1058's Halloween special drops a cobweb on every kill. This removes it again.
  halloween-cobwebs:
    enabled: true
    # Only remove webs that the Halloween special placed (they carry a marker). Webs placed by
    # players are never touched. Turn off to remove ANY web found at the death spot.
    only-special-webs: true
    # Also look again after these many ticks, in case something moved the victim during the kill.
    recheck-delay-ticks: 1

  # 2) Chests that stay invisible for some players/teams until something updates the block.
  #    The fix re-sends the chest blocks to the players after the game starts.
  invisible-chests:
    enabled: true
    # Re-send for every player of an arena when the game goes to "playing".
    on-game-start: true
    # Re-send for a single player when they get their first team spawn.
    on-first-spawn: true
    # Re-send for a player each time they respawn after dying (usually not needed).
    on-respawn: false
    # Several passes catch players whose teleport/chunk loading finishes late (20 ticks = 1 second).
    delays-ticks: [2, 20, 60]
    # Chunks around the player that are scanned for chests.
    chunk-radius: 8
    # Block names to re-send. Names missing on an older server version are simply ignored.
    block-types: [CHEST, TRAPPED_CHEST, ENDER_CHEST]

  # 3) Bought swords that do not replace the old sword.
  sword-replacement:
    enabled: true
    # Ticks to wait after the purchase before cleaning up (must be at least 1).
    delay-ticks: 1
    # Remove swords of a lower tier than the best sword the player has.
    remove-lower-tier: true
    # Also remove extra swords of the SAME tier (keeps the one with most enchantments).
    remove-same-tier-duplicates: false
    # Put the new sword into the slot of the sword it replaced.
    keep-slot: true
    # Tiers from weakest to strongest. Each entry lists the material prefixes of that tier
    # (older versions say WOOD/GOLD, newer ones WOODEN/GOLDEN). Unknown swords are never removed.
    tiers:
      - [WOOD, WOODEN]
      - [GOLD, GOLDEN]
      - [STONE]
      - [COPPER]
      - [IRON]
      - [DIAMOND]
      - [NETHERITE]

  # 4) The pop-up tower shop item has no language entry (it shows "Name not set").
  #    BedWars1058 registers the text under the wrong key, so the correct one is added to every
  #    language file.
  pop-up-tower-language:
    enabled: true
    # Shop category and content key of the tower in shop.yml.
    category: utility-category
    content: tower
    # Replace entries that only contain the generic "Name not set" / "Lore not set" placeholders.
    replace-placeholders: true
    placeholders: ["name not set", "lore not set"]
    # Text per language ISO code (lower case). "default" is used when a language has no entry.
    # {color}, {cost}, {currency}, {quick_buy} and {buy_status} are filled in by BedWars1058.
    # Existing, real translations in a language file are never overwritten.
    translations:
      default:
        name: "{color}Compact Pop-up Tower"
        lore:
          - "&7Cost: {cost} {currency}"
          - ""
          - "&7Place a compact pop-up"
          - "&7tower defense!"
          - ""
          - "{quick_buy}"
          - "{buy_status}"
      it:
