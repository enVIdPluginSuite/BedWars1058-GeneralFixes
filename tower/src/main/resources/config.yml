# BedWars1058-PopUpTowerLanguageFix
# Edit this file, then run /towerfix reload in-game or from the console. No restart needed.
# Any option you delete falls back to the default that ships inside the jar.

messages:
  prefix: "&8[&bPopUpTowerLanguageFix&8] &7"
  reload-success: "&aConfiguration reloaded."
  reload-failed: "&cReload failed, check the console. The previous settings are still active."
  no-permission: "&cYou do not have permission to do that."
  usage: "&7Usage: &f/%label% reload"

# The pop-up tower shop item has no language entry (it shows "Name not set").
#    BedWars1058 registers the text under the wrong key, so the correct one is added to every
#    language file.
enabled: true
# Shop category and content key of the tower in shop.yml.
category: utility-category
content: tower
# Replace entries that only contain the generic "Name not set" / "Lore not set" placeholders.
replace-placeholders: true
placeholders: ["name not set", "lore not set"]
# Text per language ISO code (lower case). "default" is used when a language has no entry.
# {color}, {cost}, {currency}, {quick_buy} and {buy_status} are filled in by BedWars1058.
# Existing, real translations in a language file are never overwritten.
translations:
  default:
    name: "{color}Compact Pop-up Tower"
    lore:
      - "&7Cost: {cost} {currency}"
      - ""
      - "&7Place a compact pop-up"
      - "&7tower defense!"
      - ""
      - "{quick_buy}"
      - "{buy_status}"
  it:
