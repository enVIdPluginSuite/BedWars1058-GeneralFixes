name: BedWars1058-ChestVisibilityFix
version: '${version}'
main: dev.etran.generalfixes.standalone.ChestFixPlugin
# api-version 1.13 is ignored by 1.8 - 1.12 and is the lowest value newer servers accept without legacy conversion.
api-version: '1.13'
author: LittleBotEngineer
description: Fixes chests that are invisible when a BedWars1058 game starts.
depend: [BedWars1058]

commands:
  chestfix:
    description: Manage BedWars1058-ChestVisibilityFix
    usage: /<command> [reload]

permissions:
  bwfixes.chests.admin:
    description: Allows /chestfix reload
    default: op
