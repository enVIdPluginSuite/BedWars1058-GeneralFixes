name: BedWars1058-WinFix
version: '${version}'
main: dev.etran.generalfixes.standalone.WinFixPlugin
# api-version 1.13 is ignored by 1.8 - 1.12 and is the lowest value newer servers accept without legacy conversion.
api-version: '1.13'
author: LittleBotEngineer
description: Fills in the end-of-game (winner / top kills) sidebar for BedWars1058 with the real game state.
depend: [BedWars1058]

commands:
  winfix:
    description: Manage BedWars1058-WinFix
    usage: /<command> [reload]

permissions:
  bwfixes.winfix.admin:
    description: Allows /winfix reload
    default: op
